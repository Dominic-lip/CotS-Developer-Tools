name: CotS 24x7 reliability tests

on:
  push:
    branches:
      - main
      - reliability/24x7-autonomy
      - feature/cots-observability-governor-real
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile 24x7 Python entry points
        shell: pwsh
        run: >-
          python -m py_compile
          Scripts/CotS24x7Common.py
          Scripts/CotSAgentSupervisor24x7.py
          Scripts/CotSFactoryController24x7.py
          Scripts/CotSWatchdog24x7.py
          Scripts/CotSWatchdog24x7Enhanced.py
          Scripts/CotSWatchdog24x7Final.py
          Scripts/CotSControlCenter24x7.py
          Scripts/CotSControlCenter24x7Enhanced.py
          Scripts/CotSControlCenter24x7Final.py
          Scripts/CotSSupportBundle.py
          Scripts/CotSUsageLedger.py
          Scripts/CotSUsageLedgerSafe.py
          Scripts/CotSCodexQuotaProbe.py
          Scripts/CotSProductivityGovernor.py
          Scripts/CotSLegacyGovernorRecovery.py
          Scripts/CotSProcessLiveness.py
          Scripts/CotSHardwareTelemetry.py
          Scripts/CotSLocalAI.py
          Scripts/CotSRollbackGuard.py
          Scripts/CotSNotifications.py
          Scripts/CotSOperationalMetrics.py
          Scripts/CotSChaosRunner.py
          Scripts/CotSLiveChaosMaintenance.py
      - name: Run 24x7 regression tests
        shell: pwsh
        run: python -m unittest Scripts.tests.test_cots_24x7 Scripts.tests.test_cots_24x7_enhanced Scripts.tests.test_legacy_governor_recovery Scripts.tests.test_process_liveness -v
